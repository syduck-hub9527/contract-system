[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-system-radar"
version = "1.0.0"
description = "Read-only Binance futures 5-minute DIF radar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["requests>=2.31,<3", "websocket-client>=1.7,<2"]

[project.optional-dependencies]
dev = ["ruff==0.17.0", "build==1.6.1"]

[project.scripts]
contract-radar = "contract_radar.app:main"

[tool.setuptools.packages.find]
include = ["contract_radar*"]

[tool.setuptools.package-data]
contract_radar = ["assets/*.html"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
